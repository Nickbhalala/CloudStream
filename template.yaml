AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudStream - Kinesis -> Lambda -> DynamoDB real-time aggregation with
  exactly-once writes, dead-lettering and CloudWatch alarms.

Parameters:
  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
  BatchSize:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to alarm notifications.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  EventStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub "${AWS::StackName}-events"
      ShardCount: !Ref ShardCount
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  AggregatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-aggregates"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: series, AttributeType: S }
        - { AttributeName: minute, AttributeType: S }
      KeySchema:
        - { AttributeName: series, KeyType: HASH }
        - { AttributeName: minute, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DedupeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-dedupe"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: event_id, AttributeType: S }
      KeySchema:
        - { AttributeName: event_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # Records that fail validation (bad data). Inspected by people, never retried.
  InvalidRecordsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-invalid-records"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Batches that still fail after all Lambda retries (infrastructure problems).
  FailedBatchesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-failed-batches"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-processor"
      RetentionInDays: 14

  ProcessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcessorLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-processor"
      CodeUri: .
      Handler: cloudstream.handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          AGGREGATES_TABLE: !Ref AggregatesTable
          DEDUPE_TABLE: !Ref DedupeTable
          DLQ_URL: !Ref InvalidRecordsQueue
      Policies:
        - Statement:
            - Sid: WriteAggregatesAndDedupe
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: [!GetAtt AggregatesTable.Arn, !GetAtt DedupeTable.Arn]
            - Sid: DeadLetterInvalidRecords
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt InvalidRecordsQueue.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailedBatchesQueue.QueueName
      Events:
        Stream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt EventStream.Arn
            StartingPosition: LATEST
            BatchSize: !Ref BatchSize
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt FailedBatchesQueue.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Consumer falling behind the stream.
  IteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Processor is more than 60s behind the stream
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref ProcessorFunction }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Processor invocations are failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ProcessorFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Custom metric from the handler's EMF logs.
  InvalidRecordsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Unusual number of malformed records from producers
      Namespace: CloudStream
      MetricName: InvalidRecords
      Dimensions: [{ Name: Function, Value: !Ref ProcessorFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FailedBatchesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Batches exhausted all retries and were sent to the failure queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedBatchesQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "width": 12, "properties": {"title": "Records",
            "region": "${AWS::Region}", "stat": "Sum", "period": 60,
            "metrics": [
              ["CloudStream", "AppliedRecords", "Function", "${ProcessorFunction}"],
              [".", "DuplicateRecords", ".", "."],
              [".", "InvalidRecords", ".", "."],
              [".", "RetriedRecords", ".", "."]]}},
          {"type": "metric", "width": 12, "properties": {"title": "Lag (ms)",
            "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
            "metrics": [
              ["AWS/Lambda", "IteratorAge", "FunctionName", "${ProcessorFunction}"],
              ["CloudStream", "BatchProcessingMs", "Function", "${ProcessorFunction}"]]}}
        ]}

Outputs:
  StreamName:
    Value: !Ref EventStream
  AggregatesTableName:
    Value: !Ref AggregatesTable
  DedupeTableName:
    Value: !Ref DedupeTable
  InvalidRecordsQueueUrl:
    Value: !Ref InvalidRecordsQueue
  FailedBatchesQueueUrl:
    Value: !Ref FailedBatchesQueue
