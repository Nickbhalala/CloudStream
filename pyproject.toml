[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudstream"
version = "0.1.0"
description = "Real-time event pipeline on AWS: Kinesis -> Lambda -> DynamoDB, with exactly-once aggregates and CloudWatch metrics."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikhil Bhalala" }]
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "moto[dynamodb,sqs,kinesis]>=5", "cfn-lint>=1"]

[project.scripts]
cloudstream-produce = "cloudstream.producer:main"
cloudstream-query = "cloudstream.query:main"
cloudstream-simulate = "cloudstream.simulate:main"

[tool.setuptools.packages.find]
include = ["cloudstream*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
